<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=./demo/">
  <title>NEXORA — Abriendo demostración</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6f2; color: #19231e; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); text-align: center; padding: 44px 28px; background: #fff; border: 1px solid #e4e8df; border-radius: 24px; box-shadow: 0 18px 55px rgba(27, 42, 32, .08); }
    .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: #d9f36a; font-size: 28px; font-weight: 800; }
    h1 { margin: 18px 0 8px; letter-spacing: .16em; font-size: clamp(26px, 7vw, 38px); }
    p { margin: 0 auto 24px; max-width: 38ch; color: #657067; line-height: 1.6; }
    a { display: inline-flex; align-items: center; justify-content: center; padding: 13px 20px; min-height: 46px; border-radius: 999px; background: #19231e; color: #fff; text-decoration: none; font-weight: 650; }
    a:focus-visible { outline: 3px solid #86a82f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">N</span>
    <h1>NEXORA</h1>
    <p>Abriendo la demostración interactiva del catálogo. Si no se abre automáticamente, utiliza el botón.</p>
    <a href="./demo/">Abrir demostración</a>
  </main>
  <script>window.location.replace("./demo/");</script>
</body>
</html>
